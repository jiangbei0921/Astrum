name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 确认 Chrome 可用
        run: |
          which google-chrome || which chromium || which chromium-browser
          google-chrome --version || chromium --version || true

      - name: 同步 CSP 哈希并构建单文件版
        run: |
          node tools/sync-csp-hash.js
          node tools/build-standalone.js

      # 每日前沿的数据是自动生成并提交的，语法坏掉会让整页白屏
      - name: 前沿数据语法检查
        run: node --check data/daily.js

      # 语法检查挡不住「摘要里出现 </script> 把内联脚本截断」，这条要离线样本测
      - name: 抓取器 daily-test
        run: node tools/daily-test.js

      # 每个套件单独成步：失败时能立刻看出是哪一层坏了
      - name: 功能回归 selftest
        run: node tools/selftest.js "file://$PWD/index.html"

      - name: 持久化 store-test
        run: node tools/store-test.js

      - name: 技能 skill-test
        run: node tools/skill-test.js

      - name: 数值一致性 consistency-test
        run: node tools/consistency-test.js

      - name: 无障碍 a11y-test
        run: node tools/a11y-test.js

      # 侧栏四栏组合的宽度分配 + 往返稳定性（曾因布局过渡卡死过）
      - name: 布局宽度 rail-test
        run: node tools/rail-test.js

      # 设置面板的四层结构与页内索引（索引与分组必须一一对应）
      - name: 设置层级 settings-test
        run: node tools/settings-test.js

      # 上下文隔离：验证分片不会污染 ctx / CITIES，且 15 个 intent 全覆盖
      - name: 上下文隔离 ctx-isolation-test
        run: node tools/ctx-isolation-test.js

      - name: 检索 research-test
        run: node tools/research-test.js

      - name: 安全策略 csptest
        run: node tools/csptest.js

      # 英文界面必须零中文残留（答案正文与用户输入除外，已按类别排除）。
      - name: 英文残留基线 i18n-scan
        run: node tools/i18n-scan.js --quiet --max=0

      - name: Worker 语法检查
        run: node --input-type=module --check < worker/cors-proxy.js

      - name: 构建产物与工作区一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建产生了未提交的改动，请本地重新构建后提交"
            git status --porcelain
            exit 1
          fi
