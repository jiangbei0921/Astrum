name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 第一层：静态检查与构建。不依赖浏览器，失败最快、定位最直接。
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript 语法检查
        run: |
          for f in core/*.js data/*.js tools/*.js; do
            node --check "$f" || exit 1
          done

      - name: 同步 CSP 哈希并构建单文件版
        run: |
          node tools/sync-csp-hash.js
          node tools/build-standalone.js

      - name: 构建 GitHub Pages 发布目录
        run: node tools/build-pages.js

      # 每日前沿的数据是自动生成并提交的，语法坏掉会让整页白屏
      - name: 前沿数据语法检查
        run: node --check data/daily.js

      # 语法检查挡不住「摘要里出现 </script> 把内联脚本截断」，这条要离线样本测
      - name: 抓取器 daily-test
        run: node tools/daily-test.js

      - name: 部署静态检查 v1-2-deploy-test
        run: node tools/v1-2-deploy-test.js

      - name: CI / Pages 配置检查 v1-4-ci-test
        run: node tools/v1-4-ci-test.js

      - name: 安全策略 csptest
        run: node tools/csptest.js

      # 英文界面必须零中文残留（答案正文与用户输入除外，已按类别排除）。
      - name: 英文残留基线 i18n-scan
        run: node tools/i18n-scan.js --quiet --max=0

      - name: Worker 语法检查
        run: node --input-type=module --check < worker/cors-proxy.js

      # 构建产物必须有 gitignore 保护；若 sync/build 产生未提交改动，说明源码与产物失配
      - name: 构建产物与工作区一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建产生了未提交的改动，请本地重新构建后提交"
            git status --porcelain
            exit 1
          fi

  # 第二层：离线确定性测试。覆盖原有 12 套件中的非浏览器部分 + V1-V1.3。
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检索 research-test（离线 mock）
        run: node tools/research-test.js

      - name: 任务契约 task-test
        run: node tools/task-test.js

      - name: 固定基线 p0-03-test
        run: node tools/p0-03-test.js

      - name: 控制层 control-test
        run: node tools/control-test.js

      - name: 数据闭环 b8-test
        run: node tools/b8-test.js

      - name: V1 B 阶段 v1b-test
        run: node tools/v1b-test.js

      - name: V1 C 阶段 v1c-test
        run: node tools/v1c-test.js

      - name: V1 D 阶段 v1d-test（offline）
        run: node tools/v1d-test.js --offline

      - name: V1 端到端 v1-e2e-test（offline）
        run: node tools/v1-e2e-test.js --offline

      - name: V1.1 分流 v1-1-routing-test
        run: node tools/v1-1-routing-test.js

      - name: V1.1 20 问兼容 v1-1-compat-test
        run: node tools/v1-1-compat-test.js

      - name: V1.1 端到端 v1-1-e2e-test（offline）
        run: node tools/v1-1-e2e-test.js --offline

      - name: V1.2 分流 v1-2-routing-test
        run: node tools/v1-2-routing-test.js

      - name: V1.2 附件 v1-2-attachment-test
        run: node tools/v1-2-attachment-test.js

      - name: V1.2 对比 v1-2-comparison-test
        run: node tools/v1-2-comparison-test.js

      - name: V1.2 科学规则 v1-2-science-test
        run: node tools/v1-2-science-test.js

      - name: V1.2 SIMBAD 离线边界 v1-2-simbad-test（offline）
        run: node tools/v1-2-simbad-test.js --offline

      - name: V1.3 分流 v1-3-routing-test
        run: node tools/v1-3-routing-test.js

      - name: V1.3 对比 v1-3-comparison-test
        run: node tools/v1-3-comparison-test.js

      - name: V1.3 论文全文 v1-3-paper-fulltext-test（offline）
        run: node tools/v1-3-paper-fulltext-test.js --offline

      - name: V1.3 论文 E2E v1-3-paper-e2e-test（offline）
        run: node tools/v1-3-paper-e2e-test.js --offline

      - name: V1.3 兼容 v1-3-compatibility-test
        run: node tools/v1-3-compatibility-test.js

      - name: V1.4 论文 PDF 附件 v1-4-paper-attachment-test
        run: node tools/v1-4-paper-attachment-test.js

      - name: V1.4 云端模型 Control v1-4-cloud-control-test
        run: node tools/v1-4-cloud-control-test.js

      - name: V1.5 性能基线 v1-5-perf-test
        run: node tools/v1-5-perf-test.js

      - name: V1.5 并发调度 v1-5-concurrency-test
        run: node tools/v1-5-concurrency-test.js

      - name: V1.5 TaskStore 压力 v1-5-store-stress-test
        run: node --expose-gc tools/v1-5-store-stress-test.js

      - name: V1.5 Progress Evaluator / Research Loop v1-5-research-loop-test
        run: node tools/v1-5-research-loop-test.js

      - name: V1.5 Claims/Reducer 集成 v1-5-research-loop-claims-test
        run: node tools/v1-5-research-loop-claims-test.js

      - name: V1.6 跨版本遗留 v1-6-legacy-test
        run: node tools/v1-6-legacy-test.js

      - name: V1.6 复杂 PDF 合成样本 v1-6-pdf-fixtures-test
        run: node tools/v1-6-pdf-fixtures-test.js

      - name: V1.6 研究场景质量 v1-6-research-quality-test
        run: node tools/v1-6-research-quality-test.js

      # 46 个真实天文研究基准案例（离线子集；真实网络案例由 network.yml 单独执行）
      - name: V1.7 真实天文研究基准 v1-7-research-benchmark（offline）
        run: node tools/v1-7-research-benchmark.js --offline

      # 反馈核心：配置/分类/去重/诊断/脱敏/邮件草稿
      - name: V1.8 反馈核心 v1-8-feedback-test
        run: node tools/v1-8-feedback-test.js

      # V1.9：反馈诊断与科研问题联动（论文/证据/Claim/PDF/Provider 字段）
      - name: V1.9 反馈诊断 v1-9-feedback-diagnostic-test
        run: node tools/v1-9-feedback-diagnostic-test.js

      # V1.9：独立盲测离线子集（真实网络案例标 SKIPPED_OFFLINE）
      - name: V1.9 独立盲测 v1-9-blind-research-benchmark（offline）
        run: node tools/v1-9-blind-research-benchmark.js --offline

      # V1.9：M13 目标消歧 + Control 路径多轮指代回归
      - name: V1.9 研究目标 v1-9-research-target-test
        run: node tools/v1-9-research-target-test.js

      # V1.10：最终回答整合、知识来源路由、动态论文国际化
      - name: V1.10 回答整合 v1-10-answer-composer-test
        run: node tools/v1-10-answer-composer-test.js

      - name: V1.10 知识来源 v1-10-knowledge-sources-test
        run: node tools/v1-10-knowledge-sources-test.js

      - name: V1.10 动态内容国际化 v1-10-content-i18n-test
        run: node tools/v1-10-content-i18n-test.js

      - name: V1.10 集成 v1-10-integration-test
        run: node tools/v1-10-integration-test.js

      # V1.13：回答质量、证据核验、Muse 综合
      - name: V1.13 回答质量 v1-13-answer-quality-test
        run: node tools/v1-13-answer-quality-test.js

      # V1.14：最终答案单一正文、详情分层、不截断
      - name: V1.14 输出质量 v1-14-output-quality-test
        run: node tools/v1-14-output-quality-test.js

      # V1.15：真实盲测修复回归（星座、对比、多轮、光学计算、检索限流）
      - name: V1.15 回归 v1-15-regression-test
        run: node tools/v1-15-regression-test.js

      # V1.11：流式协议、答案质量、每日增量更新
      - name: V1.11 流式协议 v1-11-stream-test
        run: node tools/v1-11-stream-test.js

      - name: V1.11 答案质量 v1-11-answer-quality-test
        run: node tools/v1-11-answer-quality-test.js

      - name: V1.11 每日增量 v1-11-daily-test
        run: node tools/v1-11-daily-test.js

      # V1.9：Provider 协议/错误分类；无 Key 时返回 BLOCKED_API_KEY(exit 2)
      - name: V1.9 Provider 验证 v1-9-provider-test
        run: |
          set +e
          node tools/v1-9-provider-test.js
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      # 无 Key 时脚本以 exit 2 返回 BLOCKED_API_KEY；有 Key 时只校验配置并提示手动运行真实调用。
      - name: V1.6 真实 Provider 配置检查
        run: |
          set +e
          node tools/v1-6-provider-test.js
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

  # 第三层：浏览器与 file://。CI 的 Linux Chrome 必须显式确认可用。
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 确认 Chrome 可用
        run: |
          which google-chrome || which chromium || which chromium-browser
          google-chrome --version || chromium --version || true

      # 功能回归：Chrome + file://，断言包含 20 问、13 Agent、CSP 违规计数
      - name: 功能回归 selftest
        run: node tools/selftest.js "file://$PWD/index.html"

      - name: 持久化 store-test
        run: node tools/store-test.js

      - name: 技能 skill-test
        run: node tools/skill-test.js

      - name: 数值一致性 consistency-test
        run: node tools/consistency-test.js

      - name: 无障碍 a11y-test
        run: node tools/a11y-test.js

      # 侧栏四栏组合的宽度分配 + 往返稳定性（曾因布局过渡卡死过）
      - name: 布局宽度 rail-test
        run: node tools/rail-test.js

      # 设置面板的四层结构与页内索引（索引与分组必须一一对应）
      - name: 设置层级 settings-test
        run: node tools/settings-test.js

      # 上下文隔离：验证分片不会污染 ctx / CITIES，且 15 个 intent 全覆盖
      - name: 上下文隔离 ctx-isolation-test
        run: node tools/ctx-isolation-test.js

      # V1.1：真实 Chrome IDB、控制层渲染、FITS/全文 UI fixture
      - name: V1.1 浏览器 v1-1-browser-test
        run: node tools/v1-1-browser-test.js

      # V1.4：白名单发布目录 + /Astrum/ 子路径 HTTP + Chrome 运行时
      - name: V1.4 Pages 本地等价 v1-4-pages-test
        run: node tools/v1-4-pages-test.js

      - name: V1.5 真实浏览器 IDB 1000 条 v1-5-idb-stress-test
        run: node tools/v1-5-idb-stress-test.js

      # V1.5 资源与缓存：DOM/Listener/Timer/Blob + 缓存命中/失效/IDB 降级
      - name: V1.5 浏览器资源 v1-5-resource-test
        run: node tools/v1-5-resource-test.js

      - name: V1.5 缓存命中与降级 v1-5-cache-test
        run: node tools/v1-5-cache-test.js

      # V1.6：多任务恢复、附件格式/冲突、真实 PDF 字节、Research UI、失败步骤、窄屏
      - name: V1.6 浏览器 v1-6-browser-test
        run: node tools/v1-6-browser-test.js

      # V1.8：三反馈入口、主动提示去重/忽略、诊断预览、确认页、帮助入口、390px 窄屏
      - name: V1.8 反馈浏览器 v1-8-feedback-browser-test
        run: node tools/v1-8-feedback-browser-test.js

      # V1.11：真实浏览器内流式增量/停止/保存；设置页测试连接 + 本地 mock SSE
      - name: V1.11 流式浏览器 v1-11-stream-browser-test
        run: node tools/v1-11-stream-browser-test.js

      - name: V1.11 Provider 设置页浏览器 v1-11-provider-browser-test
        run: node tools/v1-11-provider-browser-test.js

      # V1.11 补充：每日前沿状态、北京时间筛选、空态与缓存刷新
      - name: V1.11 每日前沿浏览器 v1-11-daily-browser-test
        run: node tools/v1-11-daily-browser-test.js

      # 结果阅读区重设计：正文/依据/详情/操作分层、移动端、深色模式
      - name: 结果阅读区 UI 浏览器 v1-12-answer-ui-test
        run: node tools/v1-12-answer-ui-test.js

      # V1.13：简单直达、复杂研究后流式、最终正文一致、停止与依据核验
      - name: V1.13 流式交付浏览器 v1-13-stream-browser-test
        run: node tools/v1-13-stream-browser-test.js

      # V1.14：单一正文、来源轻量化、长答案不截断、审计提示入详情
      - name: V1.14 输出渲染浏览器 v1-14-stream-browser-test
        run: node tools/v1-14-stream-browser-test.js
