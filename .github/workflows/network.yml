name: network

# 真实网络测试独立于发布 CI：
#   - 不阻塞 push / PR，因为外部数据源可能限流或临时不可达；
#   - 由定时任务和手动触发运行，结果单独记录；
#   - 运行器会区分 NETWORK_UNAVAILABLE 与 FAIL，不用 Mock 冒充真实。
on:
  schedule:
    # UTC 03:00 = 北京 11:00，每周一
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network
  cancel-in-progress: false

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 真实外部主机与套件
        run: node tools/v1-4-network-ci.js

      - name: 保存运行摘要
        if: always()
        run: |
          echo "网络套件已完成；NETWORK_UNAVAILABLE 表示外部主机不可达，不代表代码失败。" >> "$GITHUB_STEP_SUMMARY"
