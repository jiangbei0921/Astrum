name: daily-frontier

# 为什么放在 Actions 而不是页面里定时请求：
#   本项目是纯静态站点，没有后端。「每天自动更新」只能是构建期行为——
#   由 Action 抓取、生成 data/daily.js、提交回仓库，Pages 再重建。
#   页面端零网络请求，所以 file:// 双击打开也能看到最新一份数据。
#
# 状态语义：
#   - 抓取前先提交 sync.status=running，页面可显示“正在更新”；
#   - 抓取完成后再提交最终状态（ok / partial / failed）；
#   - 全部来源失败时保留旧论文/报道，只更新失败状态，并把本次运行标红。
#
# 为什么有两个 cron：
#   GitHub 的 schedule 事件在高峰期可能延迟甚至被丢弃（2026-11-04 的
#   01:00 UTC 运行在 01:28 UTC 仍未创建）。04:00 UTC 作为备用触发，
#   “--check-today” 会在当天已成功同步时跳过，保证实际只更新一次。
#
# GITHUB_TOKEN 推送的提交不会触发其他 workflow，因此数据提交后显式
# 派发 pages.yml，线上才会读取新数据。

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-frontier
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查今天是否已成功同步
        id: gate
        run: echo "status=$(node tools/sync-daily.js --check-today)" >> "$GITHUB_OUTPUT"

      - name: 标记开始更新
        if: steps.gate.outputs.status == 'RUN'
        run: node tools/sync-daily.js --mark-running

      - name: 提交开始状态（不触发 CI，避免为状态标记重复部署）
        if: steps.gate.outputs.status == 'RUN'
        run: |
          git config user.name "astrum-bot"
          git config user.email "astrum-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "无需更新状态"
            exit 0
          fi
          git add data/daily.js
          git commit -m "chore: 每日前沿开始更新 $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash
          git push

      - name: 抓取预印本与报道
        id: sync
        if: steps.gate.outputs.status == 'RUN'
        # 允许在失败时先提交“失败状态”，再由最后一步把运行标红。
        continue-on-error: true
        run: node tools/sync-daily.js

      - name: 重建单文件版
        if: steps.gate.outputs.status == 'RUN'
        run: node tools/build-standalone.js

      - name: 上传单文件版（最新数据）
        if: steps.gate.outputs.status == 'RUN'
        uses: actions/upload-artifact@v4
        with:
          name: astrum-standalone-daily
          path: astrum-standalone.html
          retention-days: 14

      - name: 提交（仅在确有变化时）
        if: steps.gate.outputs.status == 'RUN'
        run: |
          git config user.name "astrum-bot"
          git config user.email "astrum-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          # 只提交数据文件：astrum-standalone.html 是 gitignore 的构建产物，
          # git add 一个被忽略的路径会直接报错，整步失败。
          git add data/daily.js
          git commit -m "chore: 每日前沿同步 $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: 触发 Pages 部署
        if: steps.gate.outputs.status == 'RUN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: 同步失败时标记运行失败
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::每日前沿同步失败；旧论文/报道已保留，失败状态已写入 data/daily.js"
          exit 1
